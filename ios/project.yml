name: HingePop
options:
  bundleIdPrefix: com.mutaafaziz
  deploymentTarget: { iOS: "17.0" }
  createIntermediateGroups: true
packages:
  HingePopCore: { path: Packages/HingePopCore }
  HingePopArt: { path: Packages/HingePopArt }
settings:
  base:
    DEVELOPMENT_TEAM: Z73865R687
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HingePop:
    type: application
    platform: iOS
    sources: [HingePop]
    dependencies:
      - { package: HingePopCore }
      - { package: HingePopArt }
    info:
      path: HingePop/Info.plist
      properties:
        # ProMotion: let iPhone run the game at up to 120 Hz (iPad allows it by default).
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mutaafaziz.hingepop
        PRODUCT_NAME: HingePop
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hinge Pop
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_PREVIEWS: YES
